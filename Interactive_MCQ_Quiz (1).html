<style>

.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0} .search{flex:1;min-width:240px;border:1px solid var(--border);background:#fff;border-radius:14px;padding:13px 16px;outline:none} .search:focus{border-color:#93b4f8;box-shadow:0 0 0 4px #dbeafe}

  $('cards').innerHTML=SUBJECTS.filter(s=>s.toLowerCase().includes(f)).map(s=>{
    const n=COUNTS[s]||0, disabled=n===0;
    return `<button class="subject ${disabled?'disabled':''}" ${disabled?'disabled':''} data-subject="${s}"><div class="icon">${ICONS[s]||'◉'}</div><h3>${s}</h3><div class="count">${n} سؤال${n===0?' — غير متاح في الملف':''}</div></button>`;
  }).join('');
  document.querySelectorAll('.subject:not(.disabled)').forEach(b=>b.onclick=()=>startQuiz(b.dataset.subject));
}
renderCards(); $('search').oninput=e=>renderCards(e.target.value);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startQuiz(subject){
  state.subject=subject; state.index=0; state.correct=0; state.wrong=0; state.answered=false; state.history=[];
  state.questions=shuffle(QUESTIONS.filter(q=>q.subject===subject));
  if(!state.questions.length) return;
  $('home').classList.add('hidden'); $('result').classList.add('hidden'); $('quiz').classList.remove('hidden'); $('review').classList.add('hidden');
  $('quizSubject').textContent=subject; renderQuestion(); window.scrollTo({top:0,behavior:'smooth'});
}
function renderQuestion(){
  const q=state.questions[state.index]; state.answered=false;
  $('qCounter').textContent=`السؤال ${state.index+1} من ${state.questions.length}`;
  $('liveScore').textContent=`صح: ${state.correct} • غلط: ${state.wrong}`;
  $('progressBar').style.width=((state.index)/state.questions.length*100)+'%';
  $('sourceTag').textContent=`${q.subject} • سؤال من الملف`;
  $('questionText').textContent=q.question;
  $('feedback').className='feedback'; $('feedback').textContent='';
  $('explanation').className='explanation'; $('explanation').innerHTML='';
  $('nextBtn').disabled=true; $('nextBtn').textContent=state.index===state.questions.length-1?'عرض النتيجة 🎯':'السؤال التالي →';
  const letters=['A','B','C','D'];
  $('options').innerHTML=q.options.map((o,i)=>`<button class="option" data-i="${i}"><span class="letter">${letters[i]}</span><span>${o}</span></button>`).join('');
  document.querySelectorAll('.option').forEach(b=>b.onclick=()=>selectAnswer(Number(b.dataset.i)));
}
function selectAnswer(i){
  if(state.answered) return; state.answered=true;
  const q=state.questions[state.index], ok=i===q.correctAnswer;
  if(ok) state.correct++; else state.wrong++;
  state.history.push({q,selected:i,correct:ok});
  document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===q.correctAnswer)b.classList.add('correct');if(j===i&&!ok)b.classList.add('wrong')});
  const fb=$('feedback'); fb.className='feedback '+(ok?'correct':'wrong'); fb.innerHTML=ok?'✓ إجابة صحيحة! ممتاز 👏':`✗ إجابة غير صحيحة. الإجابة الصحيحة هي <b>${['A','B','C','D'][q.correctAnswer]}</b>`;
  const ex=$('explanation');
  const wrongs=q.whyWrong.map((w,j)=>`<li><b>${['A','B','C','D'][j]}:</b> ${w}</li>`).join('');
  ex.innerHTML=`<div class="ex-title">💡 شرح الإجابة</div><div class="correct-answer">الإجابة الصحيحة: ${['A','B','C','D'][q.correctAnswer]} — ${q.options[q.correctAnswer]}</div><div>${q.explanation}</div><div class="wrong-title">لماذا الاختيارات الأخرى ليست الأفضل؟</div><ul class="wrong-list">${wrongs}</ul>`;
  ex.className='explanation show'; $('nextBtn').disabled=false;
  $('liveScore').textContent=`صح: ${state.correct} • غلط: ${state.wrong}`;
}
$('nextBtn').onclick=()=>{if(!state.answered)return;if(state.index===state.questions.length-1)finishQuiz();else{state.index++;renderQuestion();window.scrollTo({top:0,behavior:'smooth'})}};
$('backBtn').onclick=()=>{if(confirm('هل تريدين الخروج من الامتحان؟ سيتم فقدان التقدم الحالي.')){$('quiz').classList.add('hidden');$('home').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}};
$('skipBtn').onclick=()=>finishQuiz(true);
function finishQuiz(aborted=false){
  if(aborted && !state.history.length){$('quiz').classList.add('hidden');$('home').classList.remove('hidden');return;}
  $('quiz').classList.add('hidden');$('result').classList.remove('hidden');
  const total=state.history.length, pct=total?Math.round(state.correct/total*100):0;
  $('resultSubject').textContent=`${state.subject} • ${total} سؤال تم حله`;
  $('scorePercent').textContent=pct+'%'; $('correctCount').textContent=state.correct; $('wrongCount').textContent=state.wrong; $('resultTotal').textContent=total;
  renderReview(); window.scrollTo({top:0,behavior:'smooth'});
}
function renderReview(){
  $('review').innerHTML='<h2>📊 مراجعة الإجابات</h2>'+state.history.map((h,i)=>{const q=h.q;return `<div class="review-item ${h.correct?'ok':'bad'}"><div class="review-q">${i+1}. ${q.question}</div><div class="review-a">إجابتك: <b>${q.options[h.selected]}</b><br>الإجابة الصحيحة: <b>${q.options[q.correctAnswer]}</b><br><br>${q.explanation}</div></div>`}).join('');
}
$('reviewBtn').onclick=()=>{$('review').classList.toggle('hidden');if(!$('review').classList.contains('hidden'))$('review').scrollIntoView({behavior:'smooth'})};
$('homeBtn').onclick=()=>{$('result').classList.add('hidden');$('home').classList.remove('hidden');$('review').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})};
$('restartBtn').onclick=()=>startQuiz(state.subject);
</script>
</body></html>
